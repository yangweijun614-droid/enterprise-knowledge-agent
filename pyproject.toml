[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "A Chinese enterprise policy and read-only approval lookup Agent demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.5,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1,<2",
  "langsmith>=0.4,<1",
  "mcp>=1.20,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
models = ["sentence-transformers>=4,<6"]
milvus = ["pymilvus>=2.6,<2.7"]

[tool.setuptools.packages.find]
include = ["enterprise_agent*"]

[tool.setuptools.package-data]
enterprise_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
